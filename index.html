<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agenda de Checkout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: una sola columna tipo "ficha" para el arrendatario (móvil primero); panel ancho con lista por día para administración. */
:root {
  --bg: #eef2f0;
  --surface: #ffffff;
  --surface-2: #f6f8f7;
  --ink: #12302a;
  --muted: #5a6e68;
  --line: #d6dfdb;
  --brand: #1d5c4f;
  --brand-ink: #ffffff;
  --brand-soft: #dcebe6;
  --key: #b7791f;
  --key-soft: #f6ead6;
  --ok: #2f7d4f;
  --ok-soft: #dff1e5;
  --warn: #9a5b00;
  --warn-soft: #fbecd2;
  --off: #a9b6b1;
  --err: #b42318;
  --shadow: 0 1px 2px rgba(18,48,42,.06), 0 8px 24px rgba(18,48,42,.07);
  --f-display: "Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1715; --surface: #15211e; --surface-2: #1b2a26; --ink: #e6efec; --muted: #9db0aa;
    --line: #2a3b37; --brand: #5fb8a2; --brand-ink: #0c1a17; --brand-soft: #1f3a33;
    --key: #e0a64a; --key-soft: #3a2c15; --ok: #6cc890; --ok-soft: #1b3426; --warn: #f0b456; --warn-soft: #3a2b12;
    --off: #4b5c57; --err: #ff8a7a; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1715; --surface: #15211e; --surface-2: #1b2a26; --ink: #e6efec; --muted: #9db0aa;
  --line: #2a3b37; --brand: #5fb8a2; --brand-ink: #0c1a17; --brand-soft: #1f3a33;
  --key: #e0a64a; --key-soft: #3a2c15; --ok: #6cc890; --ok-soft: #1b3426; --warn: #f0b456; --warn-soft: #3a2b12;
  --off: #4b5c57; --err: #ff8a7a; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 400 16px/1.5 var(--f-body);
  padding-inline: 16px; padding-block: 0 48px;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.15; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--key); outline-offset: 2px; border-radius: 8px; }
.mono { font-family: var(--f-mono); font-size: .86em; letter-spacing: .01em; }
.label { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* Barra de demo */
.demo-bar {
  max-width: 1040px; margin: 0 auto; padding-block: 14px;
  display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between;
}
.demo-bar .tag { font-size: 13px; color: var(--muted); }
.demo-bar .tag b { color: var(--key); font-weight: 700; }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: transparent; padding: 7px 14px; border-radius: 999px; font-weight: 600; font-size: 14px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); }

/* ===== Vista arrendatario ===== */
.tenant { max-width: 560px; margin: 0 auto; display: grid; gap: 14px; }
.hero { background: var(--brand); color: var(--brand-ink); border-radius: 20px; padding: 22px 20px 20px; display: grid; gap: 12px; }
.hero .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; opacity: .8; }
.hero h1 { font-size: clamp(26px, 6vw, 32px); }
.hero p { margin: 0; opacity: .92; }
.prop { display: flex; gap: 12px; align-items: center; background: rgba(255,255,255,.12); border-radius: 14px; padding: 12px 14px; }
.prop svg { flex: none; }
.prop div { min-width: 0; }
.prop strong { display: block; }
.prop span { font-size: 14px; opacity: .85; }

.steps { display: flex; gap: 6px; align-items: center; padding: 2px 4px; }
.steps .s { flex: 1; height: 5px; border-radius: 5px; background: var(--line); }
.steps .s.on { background: var(--brand); }
.steps-text { font-size: 13px; color: var(--muted); padding-inline: 4px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); padding: 18px; display: grid; gap: 14px; }
.card h2 { font-size: 21px; }
.card .sub { margin: -8px 0 0; color: var(--muted); font-size: 14px; }

/* Calendario */
.cal-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.cal-head h3 { font-size: 18px; text-transform: capitalize; }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); display: grid; place-items: center; }
.icon-btn:disabled { opacity: .35; cursor: not-allowed; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.cal .dow { text-align: center; font-size: 12px; font-weight: 700; color: var(--muted); padding-bottom: 2px; }
.day {
  aspect-ratio: 1 / 1; max-width: 100%; border-radius: 12px; border: 1px solid var(--line); background: var(--surface);
  display: grid; place-items: center; font-weight: 600; font-variant-numeric: tabular-nums; position: relative; font-size: 15px;
}
.day:hover:not(:disabled) { border-color: var(--brand); }
.day:disabled { background: transparent; border-color: transparent; color: var(--off); cursor: default; font-weight: 500; }
.day.blank { visibility: hidden; }
.day.today::after { content: ""; position: absolute; bottom: 6px; width: 4px; height: 4px; border-radius: 50%; background: var(--key); }
.day.sel { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.day.few:not(.sel)::before { content: ""; position: absolute; top: 6px; right: 6px; width: 6px; height: 6px; border-radius: 50%; background: var(--warn); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

/* Horarios */
.slots-group { display: grid; gap: 8px; }
.slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 8px; }
.slot {
  border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 11px 10px;
  font-weight: 600; font-variant-numeric: tabular-nums; text-align: center; line-height: 1.2;
}
.slot small { display: block; font-weight: 500; font-size: 12px; color: var(--muted); margin-top: 3px; }
.slot:hover:not(:disabled) { border-color: var(--brand); }
.slot:disabled { color: var(--off); text-decoration: line-through; background: var(--surface-2); cursor: not-allowed; }
.slot:disabled small { color: var(--off); }
.slot.sel { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.slot.sel small { color: var(--brand-ink); opacity: .85; }
.empty { padding: 18px; text-align: center; color: var(--muted); background: var(--surface-2); border-radius: 12px; font-size: 14px; }

/* Formulario */
.form { display: grid; gap: 12px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 460px) { .row2 { grid-template-columns: 1fr; } }
.field { display: grid; gap: 5px; min-width: 0; }
.field label { font-size: 14px; font-weight: 600; }
.field input, .field textarea, .field select {
  width: 100%; border: 1px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 11px 12px; min-width: 0;
}
.field input:focus, .field textarea:focus, .field select:focus { outline: none; border-color: var(--brand); background: var(--surface); }
.field .err { color: var(--err); font-size: 13px; font-weight: 600; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; background: var(--key-soft); border-radius: 12px; padding: 12px; }
.check input { width: 20px; height: 20px; margin: 1px 0 0; accent-color: var(--brand); flex: none; }

.summary { display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; background: var(--brand-soft); border-radius: 14px; padding: 14px; font-size: 15px; }
.summary dt { color: var(--muted); font-size: 13px; font-weight: 600; padding-top: 2px; }
.summary dd { margin: 0; font-weight: 600; min-width: 0; overflow-wrap: anywhere; }

.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 13px 18px; font-weight: 700; display: inline-flex; gap: 8px; align-items: center; justify-content: center; }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); flex: 1; }
.btn.primary:disabled { opacity: .45; cursor: not-allowed; }
.btn.small { padding: 8px 12px; font-size: 14px; border-radius: 10px; }
.btn.key { background: var(--key); border-color: var(--key); color: #fff; }

.sticky-cta {
  position: sticky; bottom: 0; padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px));
  background: linear-gradient(to top, var(--bg) 70%, transparent); display: flex;
}
.sticky-cta .btn { flex: 1; }

.done { text-align: center; justify-items: center; }
.done .check-icon { width: 64px; height: 64px; border-radius: 50%; background: var(--ok-soft); color: var(--ok); display: grid; place-items: center; }
.done .code { background: var(--key-soft); color: var(--ink); border-radius: 10px; padding: 6px 12px; }
.done .summary { text-align: left; width: 100%; }
.done .actions .btn { flex: 1 1 200px; }
.help { font-size: 14px; color: var(--muted); text-align: center; }
.help b { color: var(--ink); }

/* ===== Vista administración ===== */
.admin { max-width: 1040px; margin: 0 auto; display: grid; gap: 16px; }
.admin-head { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: end; }
.admin-head h1 { font-size: clamp(26px, 4vw, 34px); }
.admin-head p { margin: 4px 0 0; color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
@media (max-width: 560px) { .stats { grid-template-columns: 1fr; } }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: grid; gap: 2px; }
.stat b { font-family: var(--f-display); font-size: 28px; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat.attn b { color: var(--warn); }
.admin-grid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; align-items: start; }
@media (max-width: 860px) { .admin-grid { grid-template-columns: 1fr; } }
.day-group { display: grid; gap: 8px; }
.day-group + .day-group { margin-top: 6px; }
.day-title { display: flex; gap: 8px; align-items: baseline; font-weight: 700; }
.day-title span { color: var(--muted); font-weight: 500; font-size: 14px; }
.bk {
  display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 10px 12px; align-items: start;
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px;
}

.bk .time { font-family: var(--f-mono); font-size: 14px; font-weight: 500; font-variant-numeric: tabular-nums; }
.bk .time small { display: block; color: var(--muted); font-size: 12px; }
.bk .who { min-width: 0; }
.bk .who strong { display: block; overflow-wrap: anywhere; }
.bk .who span { font-size: 14px; color: var(--muted); display: block; overflow-wrap: anywhere; }
.bk .who em { font-size: 13px; font-style: normal; display: block; margin-top: 4px; color: var(--ink); background: var(--surface); border-radius: 8px; padding: 4px 8px; }
.bk .side { grid-column: 2; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.bk .btns { display: flex; gap: 6px; flex-wrap: wrap; }
.pill { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.pill.pend { background: var(--warn-soft); color: var(--warn); }
.pill.asig { background: var(--ok-soft); color: var(--ok); }
.pill.ex { background: var(--surface); color: var(--muted); border: 1px solid var(--line); }
.side-card h2 { font-size: 18px; }
.out { font-family: var(--f-mono); font-size: 13px; background: var(--surface-2); border: 1px dashed var(--line); border-radius: 10px; padding: 10px; overflow-wrap: anywhere; white-space: pre-wrap; }
.note { font-size: 13px; color: var(--muted); margin: 0; }

.toast {
  position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px);
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 14px;
  opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; max-width: calc(100% - 32px);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>
</head>
<body>

<div class="demo-bar">
  <div class="tag"><b>Prueba</b> · cambia de vista para ver lo que ve el arrendatario y lo que ves tú.</div>
  <div class="seg" role="group" aria-label="Vista">
    <button type="button" id="v-tenant" aria-pressed="true">Arrendatario</button>
    <button type="button" id="v-admin" aria-pressed="false">Administración</button>
  </div>
</div>

<main id="app"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  // ---------- Configuración ----------
  const CFG = {
    startMin: 9 * 60,        // 09:00
    endMin: 17 * 60 + 30,    // 17:30 (hora máxima de término)
    stepMin: 30,             // cada cuánto parte un bloque
    durMin: 60,              // duración de la recepción
    windowDays: 30,          // días hacia adelante que se pueden elegir
    minLeadDays: 1,          // no se agenda para el mismo día
    inspectors: ['Julio'],
    storeKey: 'sdo-checkout-demo-v1'
  };
  // Feriados Chile (se bloquean en el calendario)
  const HOLIDAYS = {
    '2026-10-12': 'Encuentro de Dos Mundos', '2026-10-31': 'Iglesias Evangélicas', '2026-11-01': 'Todos los Santos',
    '2026-12-08': 'Inmaculada Concepción', '2026-12-25': 'Navidad', '2027-01-01': 'Año Nuevo'
  };

  // Datos de la propiedad: vienen en el link (?prop=...&dir=...&nombre=...). Si no, se usa el ejemplo.
  const qs = new URLSearchParams(location.search);
  const PROP = {
    code: qs.get('prop') || 'Depto 1204',
    address: qs.get('dir') || 'Av. Providencia 1234, Providencia',
    tenant: qs.get('nombre') || 'Camila Rojas'
  };

  // ---------- Utilidades ----------
  const $ = (s, r = document) => r.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const pad = n => String(n).padStart(2, '0');
  const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const fromIso = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const hhmm = m => `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
  const fmtLong = s => cap(fromIso(s).toLocaleDateString('es-CL', { weekday: 'long', day: 'numeric', month: 'long' }));
  const fmtMonth = d => d.toLocaleDateString('es-CL', { month: 'long', year: 'numeric' });
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const minDate = addDays(today, CFG.minLeadDays);
  const maxDate = addDays(today, CFG.windowDays);

  function load() { try { return JSON.parse(localStorage.getItem(CFG.storeKey)) || null; } catch { return null; } }
  function save() { try { localStorage.setItem(CFG.storeKey, JSON.stringify(bookings)); } catch {} }

  function toast(msg) {
    const t = $('#toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2200);
  }
  async function copy(text) {
    try { await navigator.clipboard.writeText(text); toast('Copiado'); }
    catch { toast('No se pudo copiar: selecciona el texto y cópialo a mano'); }
  }

  // ---------- Datos de ejemplo ----------
  function nextBusiness(n) {
    let d = new Date(minDate), c = 0;
    while (true) { if (isBusiness(d)) { if (c === n) return iso(d); c++; } d = addDays(d, 1); }
  }
  function isBusiness(d) { const w = d.getDay(); return w !== 0 && w !== 6 && !HOLIDAYS[iso(d)]; }
  function seed() {
    return [
      { id: 'CO-4821', date: nextBusiness(0), start: 10 * 60, prop: 'Depto 803', address: 'Los Leones 456, Providencia', name: 'Matías Fuentes', phone: '+56 9 8123 4567', email: 'matias.f@correo.cl', note: 'Dejo las llaves en conserjería si me atraso.', status: 'asignado', inspector: 'Julio', example: true },
      { id: 'CO-4822', date: nextBusiness(0), start: 15 * 60 + 30, prop: 'Depto 1502', address: 'Av. Apoquindo 3200, Las Condes', name: 'Valentina Soto', phone: '+56 9 7654 3210', email: 'vsoto@correo.cl', note: '', status: 'pendiente', example: true },
      { id: 'CO-4823', date: nextBusiness(2), start: 9 * 60, prop: 'Depto 214', address: 'Santa Isabel 890, Santiago', name: 'Diego Paredes', phone: '+56 9 9988 7766', email: 'dparedes@correo.cl', note: 'Hay un mueble que se queda, lo conversé con el corredor.', status: 'pendiente', example: true }
    ];
  }
  let bookings = load() || seed();

  // Ocupación simulada para que la prueba se vea realista (en producción vendría del sistema)
  function simBusy(dateIso, start) {
    let h = 0; const s = dateIso + start;
    for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
    return h % 100 < 22;
  }
  function slotsFor(dateIso) {
    const out = [];
    for (let m = CFG.startMin; m + CFG.durMin <= CFG.endMin; m += CFG.stepMin) {
      const taken = simBusy(dateIso, m) ||
        bookings.some(b => b.date === dateIso && Math.abs(b.start - m) < CFG.durMin);
      out.push({ start: m, end: m + CFG.durMin, taken });
    }
    return out;
  }
  function dayEnabled(d) { return d >= minDate && d <= maxDate && isBusiness(d); }

  // ---------- Estado ----------
  const S = {
    view: location.hash === '#admin' ? 'admin' : 'tenant',
    step: 1,
    month: new Date(minDate.getFullYear(), minDate.getMonth(), 1),
    date: null, slot: null,
    form: { name: PROP.tenant, rut: '', phone: '', email: '', note: '', ok: false },
    last: null, errors: {}
  };

  // ---------- Iconos ----------
  const I = {
    home: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><circle cx="12" cy="14" r="2"/><path d="M12 16v3"/></svg>',
    left: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>',
    right: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>',
    check: '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>'
  };

  // ---------- Vista arrendatario ----------
  function tenantView() {
    const head = `
      <section class="hero">
        <div class="eyebrow">Entrega de departamento · Checkout</div>
        <h1>Hola ${esc(S.form.name.split(' ')[0] || '')}, elige cuándo entregamos tu depto</h1>
        <p>Un inspector irá a recibir la propiedad. Toma cerca de 1 hora. Elige el día y el horario que más te acomode.</p>
        <div class="prop">${I.home}<div><strong>${esc(PROP.code)}</strong><span>${esc(PROP.address)}</span></div></div>
      </section>`;
    if (S.step === 4) return head.replace('class="hero"', 'class="hero" hidden') + doneView();
    const names = ['Elige el día', 'Elige el horario', 'Confirma tus datos'];
    const prog = `
      <div class="steps" aria-hidden="true">${[1, 2, 3].map(i => `<div class="s ${i <= S.step ? 'on' : ''}"></div>`).join('')}</div>
      <div class="steps-text">Paso ${S.step} de 3 · ${names[S.step - 1]}</div>`;
    return head + prog + (S.step === 1 ? stepDay() : S.step === 2 ? stepSlot() : stepForm());
  }

  function stepDay() {
    const m = S.month, y = m.getFullYear(), mo = m.getMonth();
    const first = new Date(y, mo, 1), days = new Date(y, mo + 1, 0).getDate();
    const offset = (first.getDay() + 6) % 7; // semana parte el lunes
    const canPrev = new Date(y, mo, 0) >= minDate;
    const canNext = new Date(y, mo + 1, 1) <= maxDate;
    let cells = ['Lu', 'Ma', 'Mi', 'Ju', 'Vi', 'Sá', 'Do'].map(d => `<div class="dow">${d}</div>`).join('');
    for (let i = 0; i < offset; i++) cells += '<button class="day blank" disabled tabindex="-1" aria-hidden="true"></button>';
    for (let d = 1; d <= days; d++) {
      const dt = new Date(y, mo, d), id = iso(dt), en = dayEnabled(dt);
      const free = en ? slotsFor(id).filter(s => !s.taken).length : 0;
      const cls = ['day', id === iso(today) ? 'today' : '', S.date === id ? 'sel' : '', en && free > 0 && free <= 5 ? 'few' : ''].join(' ');
      const why = HOLIDAYS[id] ? `Feriado: ${HOLIDAYS[id]}` : !en ? 'No disponible' : free ? `${free} horarios libres` : 'Sin horarios';
      cells += `<button class="${cls}" data-day="${id}" ${en && free ? '' : 'disabled'} aria-label="${fmtLong(id)}, ${why}" title="${why}">${d}</button>`;
    }
    return `
      <section class="card">
        <div class="cal-head">
          <button class="icon-btn" id="prev" ${canPrev ? '' : 'disabled'} aria-label="Mes anterior">${I.left}</button>
          <h3>${fmtMonth(m)}</h3>
          <button class="icon-btn" id="next" ${canNext ? '' : 'disabled'} aria-label="Mes siguiente">${I.right}</button>
        </div>
        <div class="cal">${cells}</div>
        <div class="legend">
          <span><i class="dot" style="background:var(--brand)"></i>Seleccionado</span>
          <span><i class="dot" style="background:var(--warn)"></i>Quedan pocos horarios</span>
          <span><i class="dot" style="background:var(--off)"></i>Fin de semana o feriado</span>
        </div>
      </section>
      <p class="help">Atendemos de <b>lunes a viernes, 9:00 a 17:30</b>.</p>`;
  }

  function stepSlot() {
    const slots = slotsFor(S.date);
    const btn = s => `<button class="slot ${S.slot === s.start ? 'sel' : ''}" data-slot="${s.start}" ${s.taken ? 'disabled aria-label="' + hhmm(s.start) + ' ocupado"' : ''}>${hhmm(s.start)}<small>${s.taken ? 'Ocupado' : 'hasta ' + hhmm(s.end)}</small></button>`;
    const am = slots.filter(s => s.start < 13 * 60), pm = slots.filter(s => s.start >= 13 * 60);
    const free = slots.some(s => !s.taken);
    return `
      <section class="card">
        <div><h2>${fmtLong(S.date)}</h2></div>
        <p class="sub">Elige la hora de llegada del inspector.</p>
        ${free ? `
        <div class="slots-group"><div class="label">Mañana</div><div class="slots">${am.map(btn).join('')}</div></div>
        <div class="slots-group"><div class="label">Tarde</div><div class="slots">${pm.map(btn).join('')}</div></div>`
        : '<div class="empty">Este día ya no tiene horarios. Vuelve atrás y elige otro.</div>'}
      </section>
      <div class="sticky-cta"><div class="actions" style="width:100%">
        <button class="btn" id="back">Cambiar día</button>
        <button class="btn primary" id="go3" ${S.slot == null ? 'disabled' : ''}>Continuar</button>
      </div></div>`;
  }

  function stepForm() {
    const f = S.form, e = S.errors;
    const fld = (id, label, type, val, ph, extra = '') => `
      <div class="field"><label for="f-${id}">${label}</label>
      <input id="f-${id}" name="${id}" type="${type}" value="${esc(val)}" placeholder="${ph}" ${extra}>
      ${e[id] ? `<div class="err">${e[id]}</div>` : ''}</div>`;
    return `
      <section class="card">
        <h2>Confirma tu entrega</h2>
        <dl class="summary">
          <dt>Día</dt><dd>${fmtLong(S.date)}</dd>
          <dt>Hora</dt><dd>${hhmm(S.slot)} a ${hhmm(S.slot + CFG.durMin)}</dd>
          <dt>Propiedad</dt><dd>${esc(PROP.code)} · ${esc(PROP.address)}</dd>
        </dl>
        <form class="form" id="form" novalidate>
          ${fld('name', 'Nombre completo', 'text', f.name, 'Ej: Camila Rojas', 'autocomplete="name"')}
          <div class="row2">
            ${fld('phone', 'Teléfono / WhatsApp', 'tel', f.phone, '+56 9 1234 5678', 'autocomplete="tel" inputmode="tel"')}
            ${fld('rut', 'RUT', 'text', f.rut, '12.345.678-9')}
          </div>
          ${fld('email', 'Correo', 'email', f.email, 'nombre@correo.cl', 'autocomplete="email"')}
          <div class="field"><label for="f-note">Comentario para el inspector <span style="color:var(--muted);font-weight:500">(opcional)</span></label>
            <textarea id="f-note" name="note" rows="2" placeholder="Ej: las llaves quedan en conserjería">${esc(f.note)}</textarea></div>
          <label class="check"><input type="checkbox" id="f-ok" name="ok" ${f.ok ? 'checked' : ''}>
            <span>Entiendo que el departamento debe estar <b>desocupado y limpio</b> al momento de la recepción, y que debo estar presente o dejar las llaves.</span></label>
          ${e.ok ? `<div class="field"><div class="err">${e.ok}</div></div>` : ''}
          <div class="actions">
            <button type="button" class="btn" id="back2">Cambiar hora</button>
            <button type="submit" class="btn primary">Confirmar entrega</button>
          </div>
        </form>
      </section>`;
  }

  function doneView() {
    const b = S.last;
    return `
      <section class="card done">
        <div class="check-icon">${I.check}</div>
        <h2>¡Listo! Tu entrega quedó agendada</h2>
        <p class="sub" style="margin:0">Te confirmaremos por WhatsApp quién va a ir. Si necesitas cambiar la hora, escríbenos indicando tu código.</p>
        <span class="code mono">${esc(b.id)}</span>
        <dl class="summary">
          <dt>Día</dt><dd>${fmtLong(b.date)}</dd>
          <dt>Hora</dt><dd>${hhmm(b.start)} a ${hhmm(b.start + CFG.durMin)}</dd>
          <dt>Propiedad</dt><dd>${esc(b.prop)} · ${esc(b.address)}</dd>
          <dt>Nombre</dt><dd>${esc(b.name)}</dd>
        </dl>
        <div class="actions" style="width:100%">
          <button class="btn" id="restart">Agendar otra prueba</button>
          <button class="btn primary" id="see-admin">Ver cómo te llega a ti →</button>
        </div>
      </section>`;
  }

  // ---------- Vista administración ----------
  const stagingLine = b =>
    `CHECKOUT ${b.id} | ${b.date} ${hhmm(b.start)}-${hhmm(b.start + CFG.durMin)} | ${b.prop}, ${b.address} | ` +
    `Arrendatario: ${b.name} ${b.phone || ''}${b.note ? ' | Nota: ' + b.note : ''} | Inspector: ${b.inspector || 'por asignar'}`;

  function adminView() {
    const list = bookings.slice().sort((a, b) => (a.date + pad(a.start)).localeCompare(b.date + pad(b.start)));
    const pend = list.filter(b => b.status !== 'asignado').length;
    const wkEnd = iso(addDays(today, 7));
    const week = list.filter(b => b.date <= wkEnd).length;
    const groups = {};
    list.forEach(b => (groups[b.date] = groups[b.date] || []).push(b));
    const rows = Object.keys(groups).map(d => `
      <div class="day-group">
        <div class="day-title">${fmtLong(d)} <span>${groups[d].length} ${groups[d].length === 1 ? 'entrega' : 'entregas'}</span></div>
        ${groups[d].map(b => `
          <article class="bk">
            <div class="time">${hhmm(b.start)}<small>a ${hhmm(b.start + CFG.durMin)}</small></div>
            <div class="who">
              <strong>${esc(b.prop)} · ${esc(b.address)}</strong>
              <span>${esc(b.name)} · ${esc(b.phone)} · <span class="mono" style="display:inline">${esc(b.id)}</span></span>
              ${b.note ? `<em>“${esc(b.note)}”</em>` : ''}
            </div>
            <div class="side">
              <div style="display:flex;gap:6px;flex-wrap:wrap">
                ${b.example ? '<span class="pill ex">Ejemplo</span>' : ''}
                <span class="pill ${b.status === 'asignado' ? 'asig' : 'pend'}">${b.status === 'asignado' ? 'Asignado a ' + esc(b.inspector) : 'Por asignar'}</span>
              </div>
              <div class="btns">
                <button class="btn small ${b.status === 'asignado' ? '' : 'key'}" data-assign="${b.id}">${b.status === 'asignado' ? 'Quitar asignación' : 'Asignar a ' + CFG.inspectors[0]}</button>
                <button class="btn small" data-copy="${b.id}">Copiar para staging</button>
              </div>
            </div>
          </article>`).join('')}
      </div>`).join('');

    const link = buildLink(S.gen || { prop: PROP.code, dir: PROP.address, nombre: PROP.tenant });
    const msg = waMsg(S.gen?.nombre || PROP.tenant, S.gen?.prop || PROP.code, link);
    return `
      <div class="admin-head">
        <div><h1>Recepciones agendadas</h1><p>Lo que eligieron los arrendatarios, ordenado por día y hora.</p></div>
        <button class="btn" id="copy-all">Copiar todo para staging</button>
      </div>
      <div class="stats">
        <div class="stat attn"><span class="label">Por asignar</span><b>${pend}</b></div>
        <div class="stat"><span class="label">Próximos 7 días</span><b>${week}</b></div>
        <div class="stat"><span class="label">Total agendadas</span><b>${list.length}</b></div>
      </div>
      <div class="admin-grid">
        <section class="card">${rows || '<div class="empty">Aún no hay entregas agendadas. Comparte el link con el arrendatario.</div>'}</section>
        <aside class="card side-card">
          <h2>Crear link para un arrendatario</h2>
          <form class="form" id="gen">
            <div class="field"><label for="g-prop">Unidad</label><input id="g-prop" name="prop" value="${esc(S.gen?.prop ?? PROP.code)}"></div>
            <div class="field"><label for="g-dir">Dirección</label><input id="g-dir" name="dir" value="${esc(S.gen?.dir ?? PROP.address)}"></div>
            <div class="field"><label for="g-nombre">Nombre del arrendatario</label><input id="g-nombre" name="nombre" value="${esc(S.gen?.nombre ?? PROP.tenant)}"></div>
          </form>
          <div class="label">Mensaje para WhatsApp o correo</div>
          <div class="out" id="wa-out">${esc(msg)}</div>
          <button class="btn small key" id="copy-wa">Copiar mensaje</button>
          <p class="note">En esta prueba las reservas quedan solo en este navegador. En la versión real llegan a una planilla o calendario compartido.</p>
        </aside>
      </div>`;
  }
  function buildLink(g) {
    const base = location.protocol.startsWith('http') && !location.hostname.endsWith('claude.ai') && !location.hostname.endsWith('claudeusercontent.com')
      ? location.origin + location.pathname : 'https://josecano-app.github.io/sdo-agenda-checkout/';
    const p = new URLSearchParams(); if (g.prop) p.set('prop', g.prop); if (g.dir) p.set('dir', g.dir); if (g.nombre) p.set('nombre', g.nombre);
    return base + '?' + p.toString();
  }
  function waMsg(nombre, prop, link) {
    return `Hola ${(nombre || '').split(' ')[0]}, para coordinar la recepción (checkout) del ${prop}, elige el día y la hora que te acomoden en este link:\n${link}\n\nHorario de atención: lunes a viernes de 9:00 a 17:30. ¡Gracias!`;
  }

  // ---------- Render y eventos ----------
  function render() {
    $('#v-tenant').setAttribute('aria-pressed', S.view === 'tenant');
    $('#v-admin').setAttribute('aria-pressed', S.view === 'admin');
    const app = $('#app');
    app.className = S.view === 'tenant' ? 'tenant' : 'admin';
    app.innerHTML = S.view === 'tenant' ? tenantView() : adminView();
  }
  function go(step) { S.step = step; S.errors = {}; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }

  $('#v-tenant').onclick = () => { S.view = 'tenant'; render(); };
  $('#v-admin').onclick = () => { S.view = 'admin'; render(); };

  document.addEventListener('click', e => {
    const t = e.target.closest('button'); if (!t) return;
    if (t.id === 'prev') { S.month = new Date(S.month.getFullYear(), S.month.getMonth() - 1, 1); render(); }
    else if (t.id === 'next') { S.month = new Date(S.month.getFullYear(), S.month.getMonth() + 1, 1); render(); }
    else if (t.dataset.day) { if (S.date !== t.dataset.day) S.slot = null; S.date = t.dataset.day; go(2); }
    else if (t.dataset.slot) { S.slot = Number(t.dataset.slot); render(); }
    else if (t.id === 'back') go(1);
    else if (t.id === 'go3') go(3);
    else if (t.id === 'back2') { readForm(); go(2); }
    else if (t.id === 'restart') { S.date = null; S.slot = null; S.form.ok = false; go(1); }
    else if (t.id === 'see-admin') { S.view = 'admin'; render(); window.scrollTo({ top: 0 }); }
    else if (t.dataset.assign) {
      const b = bookings.find(x => x.id === t.dataset.assign);
      if (b.status === 'asignado') { b.status = 'pendiente'; delete b.inspector; toast('Asignación quitada'); }
      else { b.status = 'asignado'; b.inspector = CFG.inspectors[0]; toast(`Asignado a ${b.inspector}`); }
      save(); render();
    }
    else if (t.dataset.copy) copy(stagingLine(bookings.find(x => x.id === t.dataset.copy)));
    else if (t.id === 'copy-all') copy(bookings.slice().sort((a, b) => (a.date + pad(a.start)).localeCompare(b.date + pad(b.start))).map(stagingLine).join('\n'));
    else if (t.id === 'copy-wa') copy($('#wa-out').textContent);
  });

  document.addEventListener('input', e => {
    if (e.target.closest('#gen')) {
      const f = new FormData($('#gen')); S.gen = Object.fromEntries(f.entries());
      $('#wa-out').textContent = waMsg(S.gen.nombre, S.gen.prop, buildLink(S.gen));
    }
  });

  function readForm() {
    const fm = $('#form'); if (!fm) return;
    const f = new FormData(fm);
    S.form = { name: f.get('name').trim(), phone: f.get('phone').trim(), rut: f.get('rut').trim(), email: f.get('email').trim(), note: f.get('note').trim(), ok: !!f.get('ok') };
  }
  document.addEventListener('submit', e => {
    if (e.target.id === 'gen') { e.preventDefault(); return; }
    if (e.target.id !== 'form') return;
    e.preventDefault(); readForm();
    const f = S.form, err = {};
    if (f.name.length < 3) err.name = 'Escribe tu nombre completo.';
    if (f.phone.replace(/\D/g, '').length < 8) err.phone = 'Escribe un teléfono para avisarte, por ejemplo +56 9 1234 5678.';
    if (f.email && !/^\S+@\S+\.\S+$/.test(f.email)) err.email = 'Revisa el correo, falta el @ o el dominio.';
    if (!f.ok) err.ok = 'Marca la casilla para confirmar.';
    S.errors = err;
    if (Object.keys(err).length) { render(); const first = document.querySelector('.err'); first && first.scrollIntoView({ block: 'center' }); return; }
    if (slotsFor(S.date).find(s => s.start === S.slot)?.taken) { toast('Ese horario se acaba de ocupar. Elige otro.'); S.slot = null; go(2); return; }
    const b = {
      id: 'CO-' + Math.floor(1000 + Math.random() * 9000), date: S.date, start: S.slot,
      prop: PROP.code, address: PROP.address, name: f.name, phone: f.phone, rut: f.rut, email: f.email, note: f.note,
      status: 'pendiente', createdAt: new Date().toISOString()
    };
    bookings.push(b); save(); S.last = b; go(4);
  });

  render();
})();
</script>
</body>
</html>
