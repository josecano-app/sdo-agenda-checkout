<!DOCTYPE html>
<html lang="es">
<head>
<base target="_top">
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: una sola columna (móvil primero). Calendario mensual arriba, bloques de 2 h como tarjetas grandes, formulario corto al final. */
:root {
  --bg: #eef2f4; --surface: #ffffff; --surface-2: #f5f7f9; --ink: #142a38; --muted: #5b6d7a; --line: #d5dee5;
  --brand: #1f5f7a; --brand-ink: #ffffff; --brand-soft: #dceaf1;
  --accent: #c07a1e; --accent-soft: #f7ead8;
  --ok: #2f7d4f; --ok-soft: #dff1e5; --warn: #9a5b00; --err: #b42318; --off: #a7b4bd;
  --shadow: 0 1px 2px rgba(20,42,56,.06), 0 8px 24px rgba(20,42,56,.08);
  --f-display: "Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d161c; --surface: #142029; --surface-2: #1a2a35; --ink: #e5eef3; --muted: #9bb0bd; --line: #283a46;
    --brand: #6fb6d3; --brand-ink: #0a1820; --brand-soft: #1d3644; --accent: #e3a552; --accent-soft: #3a2b16;
    --ok: #6cc890; --ok-soft: #1b3426; --warn: #f0b456; --err: #ff8a7a; --off: #4a5b66;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d161c; --surface: #142029; --surface-2: #1a2a35; --ink: #e5eef3; --muted: #9bb0bd; --line: #283a46;
  --brand: #6fb6d3; --brand-ink: #0a1820; --brand-soft: #1d3644; --accent: #e3a552; --accent-soft: #3a2b16;
  --ok: #6cc890; --ok-soft: #1b3426; --warn: #f0b456; --err: #ff8a7a; --off: #4a5b66;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 400 16px/1.5 var(--f-body); padding-inline: 16px; padding-block: 20px 40px; -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; line-height: 1.15; text-wrap: balance; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
.label { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

.app { max-width: 560px; margin: 0 auto; display: grid; gap: 14px; }
.hero { background: var(--brand); color: var(--brand-ink); border-radius: 20px; padding: 22px 20px; display: grid; gap: 10px; }
.hero .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; opacity: .85; }
.hero h1 { font-size: clamp(25px, 6vw, 31px); }
.hero p { margin: 0; opacity: .92; }
.facts { display: flex; flex-wrap: wrap; gap: 8px; }
.facts span { background: rgba(255,255,255,.14); border-radius: 999px; padding: 4px 11px; font-size: 13px; font-weight: 600; }

.steps { display: flex; gap: 6px; padding-inline: 4px; }
.steps i { flex: 1; height: 5px; border-radius: 5px; background: var(--line); }
.steps i.on { background: var(--brand); }
.steps-text { font-size: 13px; color: var(--muted); padding-inline: 4px; margin-top: -8px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); padding: 18px; display: grid; gap: 14px; }
.card h2 { font-size: 21px; }
.sub { margin: -8px 0 0; color: var(--muted); font-size: 14px; }

.cal-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.cal-head h3 { font-size: 18px; }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); display: grid; place-items: center; }
.icon-btn:disabled { opacity: .35; cursor: not-allowed; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.dow { text-align: center; font-size: 12px; font-weight: 700; color: var(--muted); }
.day { aspect-ratio: 1 / 1; max-width: 100%; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; font-weight: 600; font-variant-numeric: tabular-nums; position: relative; }
.day:hover:not(:disabled) { border-color: var(--brand); }
.day:disabled { background: transparent; border-color: transparent; color: var(--off); cursor: default; font-weight: 500; }
.day.blank { visibility: hidden; }
.day.sel { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.day .n { position: absolute; bottom: 4px; font-size: 10px; font-weight: 700; color: var(--ok); }
.day.sel .n { color: var(--brand-ink); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--muted); }

.blocks { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 380px) { .blocks { grid-template-columns: 1fr; } }
.block { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 14px 12px; text-align: left; display: grid; gap: 2px; }
.block b { font-family: var(--f-display); font-size: 18px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.block small { color: var(--muted); font-size: 13px; font-weight: 600; }
.block:hover:not(:disabled) { border-color: var(--brand); }
.block:disabled { background: var(--surface-2); color: var(--off); cursor: not-allowed; }
.block:disabled b { text-decoration: line-through; }
.block:disabled small { color: var(--off); }
.block.sel { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.block.sel small { color: var(--brand-ink); }
.empty { padding: 18px; text-align: center; color: var(--muted); background: var(--surface-2); border-radius: 12px; font-size: 14px; }

.form { display: grid; gap: 12px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 460px) { .row2 { grid-template-columns: 1fr; } }
.field { display: grid; gap: 5px; min-width: 0; }
.field label { font-size: 14px; font-weight: 600; }
.field label span { color: var(--muted); font-weight: 500; }
.field input, .field textarea { width: 100%; min-width: 0; border: 1px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 11px 12px; }
.field input:focus, .field textarea:focus { outline: none; border-color: var(--brand); background: var(--surface); }
.err { color: var(--err); font-size: 13px; font-weight: 600; }
.summary { display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; background: var(--brand-soft); border-radius: 14px; padding: 14px; }
.summary dt { color: var(--muted); font-size: 13px; font-weight: 600; padding-top: 2px; }
.summary dd { margin: 0; font-weight: 600; min-width: 0; overflow-wrap: anywhere; }

.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 13px 18px; font-weight: 700; flex: 0 0 auto; }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); flex: 1 1 200px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

.done { text-align: center; justify-items: center; }
.done .ok { width: 64px; height: 64px; border-radius: 50%; background: var(--ok-soft); color: var(--ok); display: grid; place-items: center; }
.done .code { background: var(--accent-soft); border-radius: 10px; padding: 6px 12px; font-weight: 700; letter-spacing: .04em; }
.done .summary { text-align: left; width: 100%; }
.help { font-size: 14px; color: var(--muted); text-align: center; margin: 0; }
.loading { display: grid; place-items: center; gap: 10px; padding: 30px 0; color: var(--muted); }
.spin { width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--brand); animation: s 0.9s linear infinite; }
@keyframes s { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
.demo { background: var(--accent-soft); color: var(--ink); border-radius: 12px; padding: 10px 12px; font-size: 13px; }
</style>
</head>
<body>
<main class="app" id="app"></main>

<script>
(() => {
  const BOOT = <?!= boot ?>;

  // ---------- conexión con Apps Script (o modo demostración fuera de Google) ----------
  const LIVE = !!(window.google && google.script && google.script.run);
  function api(fn, ...args) {
    if (LIVE) return new Promise((ok, ko) => google.script.run.withSuccessHandler(ok).withFailureHandler(ko)[fn](...args));
    return new Promise((ok, ko) => setTimeout(() => { try { ok(DEMO[fn](...args)); } catch (e) { ko(e); } }, 350));
  }
  const DEMO = (() => {
    const BL = [[9, 11], [11, 13], [13, 15], [15, 17]];
    const HOL = { '2026-10-12': 'Encuentro de Dos Mundos', '2026-10-31': 'Iglesias Evangélicas', '2026-11-01': 'Todos los Santos', '2026-12-08': 'Inmaculada Concepción', '2026-12-25': 'Navidad' };
    const taken = {};
    const busy = (k, h) => { let x = 0; for (const c of k + h) x = (x * 31 + c.charCodeAt(0)) >>> 0; return x % 100 < 35 || taken[k + h]; };
    return {
      getSlots() {
        const t = new Date(); t.setHours(0, 0, 0, 0);
        const days = {}; let first = null, last = null;
        for (let i = 1; i <= 45; i++) {
          const d = new Date(t); d.setDate(d.getDate() + i);
          if (d.getDay() === 0 || d.getDay() === 6) continue;
          const k = key(d); first = first || k; last = k;
          days[k] = { closed: HOL[k] || '', blocks: BL.map(([a, b]) => ({ s: a, e: b, free: !HOL[k] && !busy(k, a) })) };
        }
        return { from: first, to: last, days };
      },
      book(f) {
        if (taken[f.date + f.start]) throw new Error('Ese bloque se acaba de ocupar.');
        taken[f.date + f.start] = 1;
        return { code: 'MP-' + String(Math.floor(1000 + Math.random() * 9000)), date: f.date, start: f.start, end: f.start + 2, where: f.address + (f.comuna ? ', ' + f.comuna : ''), name: f.name, invited: !!f.email };
      }
    };
  })();

  // ---------- utilidades ----------
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const pad = n => String(n).padStart(2, '0');
  const key = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const fromKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
  const fmtDay = k => cap(fromKey(k).toLocaleDateString('es-CL', { weekday: 'long', day: 'numeric', month: 'long' }));
  const hh = h => `${pad(h)}:00`;
  const I = {
    l: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>',
    r: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>',
    ok: '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>'
  };

  // ---------- estado ----------
  const pre = (BOOT && BOOT.prefill) || {};
  const S = {
    step: 0, data: null, month: null, date: null, start: null, err: '', busy: false,
    form: { name: pre.name || '', phone: '', email: '', address: pre.address || '', comuna: pre.comuna || '', note: '' },
    errors: {}, result: null
  };

  function render() {
    const hero = `
      <section class="hero">
        <div class="eyebrow">SDO Rent · Mantención preventiva</div>
        <h1>${S.form.name ? 'Hola ' + esc(S.form.name.split(' ')[0]) + ', agenda' : 'Agenda'} la visita de mantención</h1>
        <p>Elige el día y el bloque de 2 horas en que podemos ir a tu propiedad. Te confirmamos al instante.</p>
        <div class="facts"><span>Lunes a viernes</span><span>9:00 a 17:00</span><span>Bloques de 2 horas</span></div>
      </section>`;
    const demo = LIVE ? '' : '<div class="demo"><b>Modo demostración.</b> Los horarios ocupados son de ejemplo y las reservas no se guardan. Publicada en Google, esta página lee y agenda en el calendario real.</div>';
    let body;
    if (S.step === 0) body = `<div class="card"><div class="loading"><div class="spin"></div>Buscando horarios disponibles…</div></div>`;
    else if (S.step === -1) body = `<div class="card"><h2>No pudimos cargar la agenda</h2><p class="sub" style="margin:0">${esc(S.err)}</p><div class="actions"><button class="btn primary" id="retry">Reintentar</button></div></div>`;
    else if (S.step === 4) body = done();
    else {
      const names = ['Elige el día', 'Elige el bloque horario', 'Tus datos'];
      body = `<div class="steps" aria-hidden="true">${[1, 2, 3].map(i => `<i class="${i <= S.step ? 'on' : ''}"></i>`).join('')}</div>
        <div class="steps-text">Paso ${S.step} de 3 · ${names[S.step - 1]}</div>` + (S.step === 1 ? stepDay() : S.step === 2 ? stepBlock() : stepForm());
    }
    $('#app').innerHTML = (S.step === 4 ? '' : hero) + demo + body;
  }

  function freeCount(k) { const d = S.data.days[k]; return d ? d.blocks.filter(b => b.free).length : 0; }

  function stepDay() {
    const m = S.month, y = m.getFullYear(), mo = m.getMonth();
    const first = new Date(y, mo, 1), n = new Date(y, mo + 1, 0).getDate();
    const off = (first.getDay() + 6) % 7;
    const canPrev = key(new Date(y, mo, 0)) >= S.data.from;
    const canNext = key(new Date(y, mo + 1, 1)) <= S.data.to;
    let cells = ['Lu', 'Ma', 'Mi', 'Ju', 'Vi', 'Sá', 'Do'].map(d => `<div class="dow">${d}</div>`).join('');
    for (let i = 0; i < off; i++) cells += '<button class="day blank" disabled tabindex="-1" aria-hidden="true"></button>';
    for (let d = 1; d <= n; d++) {
      const k = key(new Date(y, mo, d)), info = S.data.days[k], free = freeCount(k);
      const why = !info ? 'No disponible' : info.closed ? 'Feriado: ' + info.closed : free ? `${free} ${free === 1 ? 'bloque libre' : 'bloques libres'}` : 'Sin bloques libres';
      cells += `<button class="day ${S.date === k ? 'sel' : ''}" data-day="${k}" ${free ? '' : 'disabled'} title="${esc(why)}" aria-label="${esc(fmtDay(k))}: ${esc(why)}">${d}${free ? `<span class="n">${free}</span>` : ''}</button>`;
    }
    return `<section class="card">
      <div class="cal-head">
        <button class="icon-btn" id="prev" ${canPrev ? '' : 'disabled'} aria-label="Mes anterior">${I.l}</button>
        <h3>${cap(first.toLocaleDateString('es-CL', { month: 'long', year: 'numeric' }))}</h3>
        <button class="icon-btn" id="next" ${canNext ? '' : 'disabled'} aria-label="Mes siguiente">${I.r}</button>
      </div>
      <div class="cal">${cells}</div>
      <div class="legend"><span>El número verde indica cuántos bloques quedan libres ese día.</span></div>
    </section>`;
  }

  function stepBlock() {
    const info = S.data.days[S.date];
    const btn = b => `<button class="block ${S.start === b.s ? 'sel' : ''}" data-start="${b.s}" ${b.free ? '' : 'disabled'}><b>${hh(b.s)} – ${hh(b.e)}</b><small>${b.free ? (b.s < 13 ? 'Mañana' : 'Tarde') : 'Ocupado'}</small></button>`;
    return `<section class="card">
      <h2>${esc(fmtDay(S.date))}</h2>
      <p class="sub">El técnico llega dentro del bloque que elijas.</p>
      <div class="blocks">${info.blocks.map(btn).join('')}</div>
      <div class="actions"><button class="btn" id="back1">Cambiar día</button><button class="btn primary" id="go3" ${S.start == null ? 'disabled' : ''}>Continuar</button></div>
    </section>`;
  }

  function stepForm() {
    const f = S.form, e = S.errors;
    const fld = (id, label, type, ph, extra = '', opt = false) => `
      <div class="field"><label for="f-${id}">${label}${opt ? ' <span>(opcional)</span>' : ''}</label>
      <input id="f-${id}" name="${id}" type="${type}" value="${esc(f[id])}" placeholder="${ph}" ${extra}>
      ${e[id] ? `<div class="err">${e[id]}</div>` : ''}</div>`;
    return `<section class="card">
      <h2>Confirma tu visita</h2>
      <dl class="summary"><dt>Día</dt><dd>${esc(fmtDay(S.date))}</dd><dt>Bloque</dt><dd>${hh(S.start)} a ${hh(S.start + 2)}</dd></dl>
      <form class="form" id="form" novalidate>
        ${fld('name', 'Nombre completo', 'text', 'Ej: Camila Rojas', 'autocomplete="name"')}
        <div class="row2">
          ${fld('phone', 'Teléfono / WhatsApp', 'tel', '+56 9 1234 5678', 'autocomplete="tel" inputmode="tel"')}
          ${fld('email', 'Correo', 'email', 'nombre@correo.cl', 'autocomplete="email"', true)}
        </div>
        ${fld('address', 'Dirección y depto', 'text', 'Ej: Santa Elisa 490, depto 1004', 'autocomplete="street-address"')}
        ${fld('comuna', 'Comuna', 'text', 'Ej: Santiago', '', true)}
        <div class="field"><label for="f-note">Equipos o indicaciones <span>(opcional)</span></label>
          <textarea id="f-note" name="note" rows="2" placeholder="Ej: calefont y termo eléctrico; avisar en conserjería">${esc(f.note)}</textarea></div>
        ${S.err ? `<div class="err">${esc(S.err)}</div>` : ''}
        <div class="actions"><button type="button" class="btn" id="back2">Cambiar bloque</button>
          <button type="submit" class="btn primary" ${S.busy ? 'disabled' : ''}>${S.busy ? 'Agendando…' : 'Agendar visita'}</button></div>
      </form>
    </section>`;
  }

  function done() {
    const r = S.result;
    return `<section class="card done">
      <div class="ok">${I.ok}</div>
      <h2>¡Listo! Tu visita quedó agendada</h2>
      <span class="code">${esc(r.code)}</span>
      <dl class="summary">
        <dt>Día</dt><dd>${esc(fmtDay(r.date))}</dd>
        <dt>Bloque</dt><dd>${hh(r.start)} a ${hh(r.end)}</dd>
        <dt>Dirección</dt><dd>${esc(r.where)}</dd>
        <dt>Nombre</dt><dd>${esc(r.name)}</dd>
      </dl>
      <p class="help">${r.invited ? 'Te enviamos la invitación a tu correo.' : 'Guarda este código.'} Si necesitas cambiar la hora, escríbenos indicándolo.</p>
    </section>`;
  }

  // ---------- acciones ----------
  function go(step) { S.step = step; S.errors = {}; S.err = ''; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
  function load() {
    S.step = 0; render();
    api('getSlots').then(d => {
      S.data = d;
      const firstFree = Object.keys(d.days).find(k => freeCount(k)) || d.from;
      const f = fromKey(firstFree); S.month = new Date(f.getFullYear(), f.getMonth(), 1);
      go(1);
    }).catch(e => { S.err = (e && e.message) || 'Intenta de nuevo en un momento.'; S.step = -1; render(); });
  }
  function readForm() {
    const fm = $('#form'); if (!fm) return;
    const fd = new FormData(fm);
    ['name', 'phone', 'email', 'address', 'comuna', 'note'].forEach(k => S.form[k] = String(fd.get(k) || '').trim());
  }

  document.addEventListener('click', e => {
    const t = e.target.closest('button'); if (!t || t.disabled) return;
    if (t.id === 'prev') { S.month = new Date(S.month.getFullYear(), S.month.getMonth() - 1, 1); render(); }
    else if (t.id === 'next') { S.month = new Date(S.month.getFullYear(), S.month.getMonth() + 1, 1); render(); }
    else if (t.dataset.day) { if (S.date !== t.dataset.day) S.start = null; S.date = t.dataset.day; go(2); }
    else if (t.dataset.start) { S.start = Number(t.dataset.start); render(); }
    else if (t.id === 'back1') go(1);
    else if (t.id === 'go3') go(3);
    else if (t.id === 'back2') { readForm(); go(2); }
    else if (t.id === 'retry') load();
  });

  document.addEventListener('submit', e => {
    if (e.target.id !== 'form') return;
    e.preventDefault(); readForm();
    const f = S.form, err = {};
    if (f.name.length < 3) err.name = 'Escribe tu nombre completo.';
    if (f.phone.replace(/\D/g, '').length < 8) err.phone = 'Escribe un teléfono, por ejemplo +56 9 1234 5678.';
    if (f.email && !/^\S+@\S+\.\S+$/.test(f.email)) err.email = 'Revisa el correo: falta el @ o el dominio.';
    if (f.address.length < 5) err.address = 'Escribe la dirección y el número de depto.';
    S.errors = err; S.err = '';
    if (Object.keys(err).length) { render(); return; }
    S.busy = true; render();
    api('book', { date: S.date, start: S.start, ...f }).then(r => {
      S.busy = false; S.result = r; go(4);
    }).catch(ex => {
      S.busy = false;
      const msg = (ex && ex.message) || 'No se pudo agendar. Intenta de nuevo.';
      if (/ocup/i.test(msg)) {
        // Recarga la disponibilidad y vuelve a elegir bloque
        api('getSlots').then(d => { S.data = d; S.start = null; go(2); S.err = msg; render(); });
      } else { S.err = msg; render(); }
    });
  });

  load();
})();
</script>
</body>
</html>
